# XcodeGen spec for the LP-100A out-of-process plugin (ExtensionKit `.appex`).
#
# SwiftPM can't build `.appex` bundles, so this small Xcode project produces the
# extension. It links only RadioPluginKit + this repo's own LP100AApp library; the
# standalone app and the in-process plugin (plain `swift build`) are unaffected.
#
# The generated .xcodeproj is gitignored -- regenerate with:  (cd Xcode && xcodegen generate)
# `scripts/make-radioplugin.sh` does this and packages the `.radioplugin`.
#
# Versioning: the extension carries the SAME version as the app release it ships with.
# `info.properties` below make xcodegen write `$(MARKETING_VERSION)` /
# `$(CURRENT_PROJECT_VERSION)` placeholders into Extension/Info.plist (tracked; regenerate
# after editing this file), and scripts/make-radioplugin.sh + scripts/package-signed.sh pass
# both settings as VERSION on the xcodebuild command line. plugin.json's "version" is
# stamped from the same VERSION (its __VERSION__ placeholder) when the .radioplugin is packaged.

name: LP100APlugin
options:
  bundleIdPrefix: org.vu3esv.radiosuite
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  RadioPluginKit:
    url: https://github.com/VU3ESV/RadioPluginKit.git
    from: "1.2.0"
  LP100AApp:
    path: ..              # this repo's SwiftPM package (LP100AApp library)

targets:
  LP100AExtension:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: Extension
        excludes:
          - plugin.json    # packaged alongside the .appex, not compiled
    info:
      path: Extension/Info.plist
      properties:
        CFBundleName: LP-100A
        CFBundleDisplayName: LP-100A
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: org.vu3esv.radiosuite.plugin
    settings:
      base:
        # IMPORTANT: this bundle id is the plugin's identity -- it must match
        # `plugin.json`'s `id` so the suite correlates the manifest to the extension.
        PRODUCT_BUNDLE_IDENTIFIER: org.vu3esv.radiosuite.LP100A
        # Placeholders for a bare `xcodebuild` / Xcode GUI build; the scripts override both
        # with the app's VERSION (see the Versioning note at the top).
        MARKETING_VERSION: "0.0.0-dev"
        CURRENT_PROJECT_VERSION: "0.0.0-dev"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"      # ad-hoc for local dev; Developer-ID needed to ship
        ENABLE_HARDENED_RUNTIME: YES                            # required for notarization
        CODE_SIGN_ENTITLEMENTS: Extension/LP100A.entitlements   # app-sandbox + network.client -> macOS registers it
    dependencies:
      - package: RadioPluginKit
        product: RadioPluginKit
      - package: RadioPluginKit
        product: RadioPluginUI
      - package: LP100AApp
        product: LP100AApp
